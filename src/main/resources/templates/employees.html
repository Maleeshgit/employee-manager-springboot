<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 1100px; }
        form { margin-bottom: 1.5rem; }
        .field { display: flex; flex-direction: column; margin-bottom: 1rem; max-width: 420px; }
        input { padding: .5rem; }
        .error { color: #b00020; margin: .25rem 0 0; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: .6rem; text-align: left; }
        th { background: #f2f2f2; }
        td form { display: inline; }
        button, a { padding: .45rem .7rem; }
    </style>
</head>
<body>
<h1>Employee Management</h1>

<h2>Add Employee</h2>
<form th:action="@{/employees}" th:object="${employee}" method="post">
    <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" th:field="*{fullName}">
        <p class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
    </div>

    <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}">
        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>

    <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" type="text" th:field="*{phone}">
        <p class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
    </div>

    <div class="field">
        <label for="department">Department</label>
        <input id="department" type="text" th:field="*{department}">
        <p class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></p>
    </div>

    <div class="field">
        <label for="salary">Salary</label>
        <input id="salary" type="number" step="0.01" min="0.01" th:field="*{salary}">
        <p class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></p>
    </div>

    <button type="submit">Save Employee</button>
</form>

<h2>Employees</h2>
<form th:action="@{/employees}" method="get">
    <label for="keyword">Search by name</label>
    <input id="keyword" type="search" name="keyword" th:value="${keyword}">
    <button type="submit">Search</button>
    <a th:href="@{/employees}">Clear</a>
</form>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Full name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="7">No employees found.</td>
    </tr>
    <tr th:each="employeeItem : ${employees}">
        <td th:text="${employeeItem.id}"></td>
        <td th:text="${employeeItem.fullName}"></td>
        <td th:text="${employeeItem.email}"></td>
        <td th:text="${employeeItem.phone}"></td>
        <td th:text="${employeeItem.department}"></td>
        <td th:text="${employeeItem.salary}"></td>
        <td>
            <a th:href="@{/employees/{id}/edit(id=${employeeItem.id})}">Edit</a>
            <form th:action="@{/employees/{id}/delete(id=${employeeItem.id})}"
                  method="post"
                  onsubmit="return confirm('Delete this employee?');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
