<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Employee</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 600px; }
        .field { display: flex; flex-direction: column; margin-bottom: 1rem; }
        input { padding: .5rem; }
        .error { color: #b00020; margin: .25rem 0 0; }
        button, a { padding: .45rem .7rem; }
    </style>
</head>
<body>
<h1>Edit Employee</h1>

<form th:action="@{/employees/{id}/update(id=${employee.id})}"
      th:object="${employee}"
      method="post">
    <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" th:field="*{fullName}">
        <p class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
    </div>

    <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}">
        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>

    <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" type="text" th:field="*{phone}">
        <p class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
    </div>

    <div class="field">
        <label for="department">Department</label>
        <input id="department" type="text" th:field="*{department}">
        <p class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></p>
    </div>

    <div class="field">
        <label for="salary">Salary</label>
        <input id="salary" type="number" step="0.01" min="0.01" th:field="*{salary}">
        <p class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></p>
    </div>

    <button type="submit">Update Employee</button>
    <a th:href="@{/employees}">Cancel</a>
</form>
</body>
</html>
